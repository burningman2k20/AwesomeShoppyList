<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="androidGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#064e3b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle / Android adaptive icon background -->
  <rect width="512" height="512" rx="128" fill="url(#androidGreenGrad)" />

  <!-- Shopping Bag / Cart Emblem with Checkmark -->
  <g filter="url(#shadow)">
    <!-- Shopping bag body -->
    <path d="M160 190 H352 L372 400 H140 Z" fill="#ffffff" rx="16" />
    <!-- Handle -->
    <path d="M200 190 V140 C200 108 225 82 256 82 C287 82 312 108 312 140 V190" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    <!-- Checkmark on bag -->
    <path d="M216 295 L244 323 L302 260" fill="none" stroke="#059669" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
